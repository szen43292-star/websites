name: Deploy Gokul Children's Hospital site

on:
  push:
    branches: [main]
    paths:
      - "gokul-childrens-hospital/**"
      - ".github/workflows/deploy-gokul.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild pages from content
        run: python3 gokul-childrens-hospital/_src/build.py

      - name: Prepare site (drop editing sources)
        run: |
          cp -r gokul-childrens-hospital _site
          rm -rf _site/_src _site/README.md
          touch _site/.nojekyll
          # This GitHub Pages copy is a preview of the redesign: keep it out of
          # search results so it never competes with gokulchildhospital.com.
          # Remove this line if GitHub Pages becomes the official host.
          sed -i 's|<meta name="theme-color"|<meta name="robots" content="noindex, nofollow">\n<meta name="theme-color"|' _site/*.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
